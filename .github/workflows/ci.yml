name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  redline-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 红线守卫（受保护文件/旁路写/硬编码Key/图片落盘）
        run: bash ci/redline_guard.sh

  bff-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: BFF 契约测试
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY_TEST }}
        run: |
          cd bff
          node server.js &
          # 原为 `sleep 1`：慢 runner 上服务未就绪会让契约测试失败或空跑。
          # 改为轮询健康检查（/api/health 为公开端点，无需 token）。
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8787/api/health >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8787/api/health >/dev/null || { echo "FAIL: BFF 未在 20s 内就绪"; exit 1; }
          bash test_contract.sh

  algorithms-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 算法层平价测试（Node 新实现 vs Python 原实现）
        run: |
          cd bff
          node lib/algorithms/run-tests.js


  admin-web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - name: admin-web install
        run: |
          cd apps/admin-web
          npm ci
      - name: admin-web lint（ESLint，--max-warnings 0）
        run: |
          cd apps/admin-web
          npm run lint
      - name: admin-web 类型检查 & 构建（build = tsc --noEmit && vite build）
        run: |
          cd apps/admin-web
          npm run build

  store-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 店内节点(Node) + seed 测试 + DDL 幂等
        run: |
          node bff/store-node/run-tests.js
          # seed 平价测试：真实基座库不入 VCS（store-inventory/.gitignore 的 *.db），
          # seed/testutil.copyBaseDb() 会按 migrations 全量重建后做 Node↔Python 差分。
          # 2026-09-28 之前此步骤在基座库缺失时静默 exit 0（假绿）；现已真实执行。
          node bff/store-node/seed/run-tests.js
          rm -f /tmp/test_ci.db
          sqlite3 /tmp/test_ci.db < store-inventory/migrations/001_new_tables.sql
          sqlite3 /tmp/test_ci.db < store-inventory/migrations/001_new_tables.sql
          sqlite3 /tmp/test_ci.db "SELECT count(*) FROM sqlite_master WHERE type='table';"

  writeback-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # T7 写回闭环：本脚本自带隔离（临时 sqlite + 隔离 BFF_DATA_DIR + SI_SCHEDULER=0），
      # 不依赖真实经营数据与已运行的服务，一条命令跑完「确认→队列→消费器→/api/sync→快照回写」。
      - name: 写回闭环端到端（rev 冲突 + 重复执行幂等）
        run: node scripts/e2e-writeback.js

  kmp-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: KMP commonTest（经 android-app 根工程构建 :shared）
        # kmp-shared 不是 Gradle 根工程：
        #   1) 它没有 gradlew / gradle-wrapper.jar；
        #   2) 它没有声明 kotlin("multiplatform") / com.android.library / app.cash.sqldelight
        #      的插件版本（版本声明在 apps/android-app/build.gradle.kts）。
        # 而 apps/android-app/settings.gradle.kts 已把 :shared 映射到 ../../kmp-shared。
        # 因此必须在 android-app 根下构建；原 `cd kmp-shared && ./gradlew` 必挂。
        run: |
          cd apps/android-app
          ./gradlew :shared:compileKotlinMetadata :shared:testDebugUnitTest --stacktrace

  lint-zero-dep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 零依赖静态检查（全量 JS 语法 + 卫生规则）
        run: node scripts/lint-zero-dep.js

  debt-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 基线与欠账总表漂移校验
        shell: pwsh
        run: scripts/gen-debt-table.ps1 -Check
