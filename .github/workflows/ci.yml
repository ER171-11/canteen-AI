name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  redline-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 红线守卫（受保护文件/旁路写/硬编码Key/图片落盘）
        run: bash ci/redline_guard.sh

  bff-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: BFF 契约测试
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY_TEST }}
        run: |
          cd bff
          node server.js &
          sleep 1
          bash test_contract.sh

  algorithms-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 算法层平价测试（Node 新实现 vs Python 原实现）
        run: |
          cd bff
          node lib/algorithms/run-tests.js


  admin-web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - name: admin-web install & build
        run: |
          cd apps/admin-web
          npm ci
          npm run build

  store-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 店内节点(Node) + seed 测试 + DDL 幂等
        run: |
          node bff/store-node/run-tests.js
          node bff/store-node/seed/run-tests.js
          rm -f /tmp/test_ci.db
          sqlite3 /tmp/test_ci.db < store-inventory/migrations/001_new_tables.sql
          sqlite3 /tmp/test_ci.db < store-inventory/migrations/001_new_tables.sql
          sqlite3 /tmp/test_ci.db "SELECT count(*) FROM sqlite_master WHERE type='table';"

  kmp-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: KMP commonTest
        run: |
          cd kmp-shared
          ./gradlew :compileKotlinMetadata testDebugUnitTest --stacktrace
