# 熊猫五福 · 对齐 liuai/native 工程级 Gradle 属性
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# aapt2：仅 arm64 Linux 需要（aapt2 官方只有 x86-64，故复用 liuai 的 qemu 包装器）。
# Windows x86-64 不要设置此项，否则会指向不存在的 /home/fushunwu/... 直接构建失败。
# 如需在 arm64 Linux 上构建，临时放开下面这行：
# android.aapt2FromMavenOverride=/home/fushunwu/Projects/liuAI/toolchain/aapt2-qemu/aapt2

# KMP
kotlin.mpp.androidSourceSetLayoutVersion=2
